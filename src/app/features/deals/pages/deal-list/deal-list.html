<div class="page-container">
  <header class="page-header">
    <div>
      <h1>Oportunidades Comerciales</h1>
      <p class="subtitle">Gestiona y avanza tratos comerciales en el embudo</p>
    </div>
    <a *hasPermission="'deals:create'" routerLink="new" class="btn btn-primary">+ Nueva Oportunidad</a>
  </header>

  <!-- Estado de carga -->
  @if (loading()) {
    <div class="loading-state">
      <p>Cargando oportunidades del CRM...</p>
    </div>
  }

  <!-- Alerta de error -->
  @if (errorMessage()) {
    <div class="alert alert-error">
      {{ errorMessage() }}
    </div>
  }

  <!-- Presentational Dumb Component con Signal Inputs & Outputs -->
  @if (!loading()) {
    <app-deal-table
      [deals]="filteredDeals()"
      [stageNames]="stageNames()"
      (moveToNext)="onMoveToNextStage($event)"
      (delete)="onDeleteDeal($event)"
    />
  }
</div>
