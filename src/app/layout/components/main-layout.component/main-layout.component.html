<div class="layout-wrapper">
  <a href="#main-content" class="skip-link">Saltar al contenido</a>
  <header class="navbar">
    <div class="nav-left">
      <a routerLink="/deals" class="brand">
        <span class="brand-mark" aria-hidden="true">C</span>
        <span class="brand-title">CRM Deals</span>
      </a>

      <nav class="nav-links" aria-label="Navegación principal">
        <a
          routerLink="/deals"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          class="nav-link"
        >
          Oportunidades
        </a>
      </nav>
    </div>

    <div class="nav-right">
      @if (currentUser(); as user) {
        <div class="user-chip">
          <span class="user-avatar" aria-hidden="true">{{
            (user.full_name || user.email).charAt(0).toUpperCase()
          }}</span>
          <div class="user-details">
            <span class="user-name" [title]="user.full_name || user.email">{{
              user.full_name || 'Usuario'
            }}</span>
            <span class="user-role">{{ user.role }}</span>
          </div>
        </div>
      }

      <button type="button" class="btn btn-logout" (click)="onLogout()" title="Cerrar sesión">
        Cerrar sesión
      </button>
    </div>
  </header>

  <main id="main-content" class="layout-main" tabindex="-1">
    <router-outlet />
  </main>
</div>
